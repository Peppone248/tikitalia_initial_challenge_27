# Approach B v3 (31/10/2026), chosen on the IDSSE validation only (REPORT_B.md, section 9).
# B v1 (30/10): baseline_b_v1.yaml; B v2 (31/10): baseline_b_v2.yaml.
# The public 5 minutes were looked at after the choice, as a structure check.

dead_from: c_v3                # the D mask: approach C v3 (v1 HMM D + Smart Tagging anchor)
c3_config_dir: config_c3       # used to regenerate it (scripts/make_submission_b.py)

window: 25                     # +/- frames of the nearest-player majority vote (official: 50)
unseen: spread                 # no ball vote in the window -> the more spread-out team
spread_smooth: 75              # frames, smoothing of the spread difference
min_poss_s: 2.0                # possessions shorter than this go to the team before them

slow_dead:                     # D-SLOW (point 1), on top of the c_v3 D
  enabled: true
  v_max_ms: 1.1                # mean player speed below this = everybody walking
  smooth_frames: 50
  min_s: 3.0
  close_s: 1.0
  unseen_share: 0.5            # only where the ball is mostly unseen

# --- tracking cleaning (hmm_v0/clean_b.py, REPORT_B.md section 10): obvious tracker errors fixed by
# code before everything else. Physical / football constraints over the whole match: no frame and no
# slot is typed anywhere (the keeper slots are read from the ATD metadata, position_type).
cleaning:
  keeper_identity:             # a keeper slot of team T inside the OPPONENT's box, on a stretch of
    enabled: true              # track that did not run there from T's own half = the other keeper
    max_step_m: 2.5            # a jump longer than this between two frames (62 m/s) = another person
    min_in_box_s: 0.5          # time in the opponent's box needed to act (box-edge jitter)
    frozen_s: 2.0              # inside a wrong keeper stretch, identical coordinates this long = a
                               # frozen ghost: removed, not given to the other team
  ball_short_gaps:             # ball gaps of at most max_s filled by a straight line (REPORT_B 15)
    enabled: false
    max_s: 1.0
  team_continuity:             # R5 (01/11): a new fragment continuing an OPPONENT's ended track, while
    enabled: true              # its team has >= min_imbalance more players tracked, is the opponent
    max_gap_s: 1.0             # the ended track: at most this before the fragment starts,
    reach_m: 2.0               # at most reach_m + max_speed * gap from its start
    max_speed: 8.0
    min_imbalance: 2           # median (team count - other team count) over the fragment
                               # IDSSE: no change on degraded / clean; degraded_ts +0.0067 (3/4)

# --- round 3, B v3 (REPORT_B.md, section 9): who has the ball ----------------------------------------
team_mode: v3                  # v3 = control votes + keep last + position model; v2 = nearest + spread
possession_v3:
  control_m: 1.5               # (8, 9) a vote only when the nearest player is this close ...
  max_ball_speed: 8.0          #        ... and the ball is slower than this (not flying)
  window: 25                   # majority of the control votes over +/- window frames
  max_rel_speed: null          # R2 (01/11): a vote only when |v_ball - v_player| <= this (m/s); null = off
                               #   IDSSE: worse at 2, 3 and 4 m/s (REPORT_B 13) -> off
  pass_by:                     # R2b: a team's run of votes during which the ball never slows = a ball
    enabled: false             # running past those players, not control.
                               #   IDSSE: -0.0074 degraded (0/7), -0.0132 clean (1/6) -> off
    min_speed: 3.0             # the ball faster than this at the run's start ...
    min_decel: 1.5             # ... and never this much below the run's highest speed so far
    join: 2                    # gaps of at most this many frames inside a run
  restart_team:                # R1b: the team that took a restart keeps the ball until the opponent's
    enabled: false             # first control vote (the taker: nearest to the ball at the R1 kick).
                               #   IDSSE: -0.0017 degraded (2/4), +0.0020 clean (3/0) -> off
    near_m: 2.0
    max_s: 10
  keep_last_s: 1.0             # no control: the last team that controlled keeps it this long
  min_poss_s: 1.5              # possessions shorter than this go to the team before them
  keeper_hold:                 # a team controlling the ball >= 1 s in its OWN penalty area keeps it
    enabled: true              # until the release (ball > release_speed): an opponent pressing the
    min_hold_s: 1.0            # keeper is not a change. IDSSE: +0.000 degraded, +0.001 clean (its
    gap_s: 0.5                 # keepers are tracked well); BAR-ATH: 46 holds, fixes the keeper whose
    in_box_share: 0.8          # tracked point drifts off the ball while he holds it (REPORT_B 9.6)
    max_hold_s: 8
    release_speed: 8.0
    flight_until_control: false  # ball in the air after the release -> keeper's team: -0.0004, off
    max_flight_s: 4
  keeper_catch:                # the tracker loses the ball in the keeper's hands: a ball gap after a
    enabled: true              # fast ball towards T's goal, ended by T's deepest player controlling it
    min_speed: 8.0             # in T's own box, is T's from the arrival at the keeper (REPORT_B 12)
    look_s: 0.5                # before the gap: the ball seen this long, faster than min_speed,
    near_goal_m: 25            # last seen this close to T's goal line (shot / cross range, a priori)
    reappear_s: 1.0            # after: T's first control vote within this
    max_gap_s: 15
supervised_team:               # branch supervised-test (REPORT_B 14): the team in play learned on IDSSE
  enabled: false               # (supervised/team_model.json, scripts/eval_supervised.py --save-model);
  model: supervised/team_model.json   # the dead mask stays the rules'. switch_cost: from the JSON
hmm3:                          # REPORT_B 17: one H / A / D HMM -- learned dead ball + learned team,
  enabled: false               # transitions counted on IDSSE, minimum durations 0.8 s / 2 s, Viterbi.
  model: supervised/hmm3_model.json   # IDSSE: 0.590 degraded, 0.714 clean (vs 0.552 / 0.693)
refine:                        # REPORT_B 20, 23: move each predicted change to the most likely frame within
  enabled: false               # +/- 2 s (supervised/refine_model.json, eval_refine.py --save-model); needs hmm3
  model: supervised/refine_model.json
position_model:                # (7) P(home in possession) from the players' shape and motion
  path: config_b/position_model.json   # trained on IDSSE (scripts/train_position_model.py)
  smooth_frames: 75
  l2: 1.0

# --- round 2 (REPORT_B.md, section 8): each rule measured alone and together on IDSSE ---------------
goalkeeper_fix:                # (1) a goalkeeper-like fragment of a slot takes the team defending
  enabled: true                #     that goal (the tracker re-attaches slots across teams)
  min_s: 10                    # fragment length
  in_box_share: 0.9            # share of the fragment inside one penalty area
  deepest_share: 0.6           # share of it as the deepest of all players towards that goal

placed_dead:                   # (2) ball seen still on the pitch, not held by a goalkeeper = dead
  enabled: true
  v_still: 0.5                 # m/s
  min_still_s: 2.0
  hold_m: 1.0                  # a player this close for hold_share of the span, in his own box
  hold_share: 0.7              #   = the goalkeeper with the ball in his hands: alive
  back_s: 10                   # dead from where the ball was last seen moving (max back_s)
  lead_s: 2                    # to the kick (first ball > kick_speed within lead_s)
  kick_speed: 8.0

ball_out_start:                # a dead span in which the ball is seen LEAVING the pitch starts when it
  enabled: true                # leaves: before that, the ball seen inside and moving is play (Law 9).
  continuous: true             # only the ball seen without a break up to the crossing,
  approach_s: 4                # at most this long before it,
  min_approach_m: 2.0          # getting this much closer to the line it crosses,
  min_speed: 2.0               # and moving (m/s). IDSSE: +0.003 clean (6/7), -0.000 degraded;
  in_m: 0.5                    # 98-99% of the frames given back to play were play.
  out_m: 0.5                   # inside / outside the lines by these margins (m)
  skip_tag_types: [free kick]  # a span with a Smart Tagging free kick: the stoppage is the whistle,
                               # the ball going out afterwards is the ball kicked away

# --- 01/11, second batch (REPORT_B 13): dead-ball boundaries, applied after ball_out_start in the
# order R4 -> R3 -> R1 (hmm_v0.dead_b.extra_dead). Every number set a priori; decided on IDSSE.
restart_kick:                  # R1: a Smart Tagging restart ends the dead span at its kick
  enabled: true                # IDSSE alone: +0.0019 degraded (6/1), +0.0008 clean (4/3), +0.0013 degraded_ts
  types: [corner kick, goal kick, throw-in, free kick, kick off (start), kick off (after goal)]
  kick_speed: 8.0              # the kick: ball seen leaving faster than this (over measure_s) ...
  measure_s: 0.2
  still_speed: 2.0             # ... after being seen slower than this, or unseen,
  rest_s: 1.0                  #     within this before (the kick is dated to the end of the rest)
  margin_m: 2.0                # at most this far outside the lines
  extend_s: 3.0                # the stoppage must be within this before the kick; a dead span ending
                               # this close before it (ball unseen / still) is extended to the kick
  max_after_s: 15              # after the kick: play, until a new stoppage shows (at most this long):
  out_m: 0.5                   #   ball seen this far outside,
  stop_unseen_s: 2.0           #   ball unseen this long,
  stop_still_s: 2.0            #   ball seen slower than still_speed this long
ball_leaves_unseen:            # R3: the ball lost on its way out of the pitch
  enabled: true                # IDSSE: R3 alone -0.0023 degraded (3/4), R3b -0.0014 (2/4) -> off;
                               # R3c (reappear_m 3) +0.0004 degraded (4/1), 0 clean -> on
  min_unseen_s: 3.0            # the gap after it lasts at least this
  look_s: 0.4                  # direction / speed from the seen positions over this
  min_speed: 3.0
  near_m: 5.0                  # last seen at most this far from the line it heads to,
  max_cross_s: 1.0             # crossing it within this
  max_s: 60                    # dead from the crossing until the ball is seen again, at most this
  max_player_speed: null       # R3b: only if the median mean player speed after the crossing ...
  player_speed_s: 5.0          # ... over this long is at most max_player_speed (m/s); null = off
  reappear_m: 3.0              # R3c: only if the ball is seen again this close to the line it left by
                               #      (or beyond it); null = R3 / R3b
dead_islands:                  # R6: a play island between two dead spans, ball never seen, players slow
  enabled: true                # IDSSE: +0.0039 degraded (7/0), 0 clean
  max_s: 10
  max_player_speed: 2.0
slow_from_ball_loss:           # R4: a D-SLOW stoppage starts where the ball was last seen
  enabled: true                # IDSSE alone: +0.0014 degraded (7/0), 0 clean, +0.0014 degraded_ts (7/0)
  back_s: 6.0                  # if the ball has been unseen without a break from at most this before

# --- 04/11, fourth batch (REPORT_B 26): measured on IDSSE, off until they gain there. Every number a priori.
players_running:               # R8: everybody running = play, ball seen or not
  enabled: false
  min_ms: 2.5                  # IDSSE (section 3): at this mean speed at most 5% of the frames are dead
  min_s: 3.0
fast_ball_play:                # R9: a fast ball seen on the pitch, away from the lines, for this long = play
  enabled: false
  min_ms: 8.0
  min_s: 1.0
  in_m: 1.0
long_unseen:                   # R10: ball unseen this long with slow players = stoppage, not a possession
  enabled: false
  min_s: 15
  max_ms: 1.5
whistle:                       # R7 (REPORT_B 18): the referee's whistle from the match audio
  enabled: false               # (scripts/detect_whistles.py -> path); no labelled game with audio:
  path: outputs/whistles/BAR-ATH_whistles.json   # checked on BAR-ATH without labels only
  slow_s: 3.0                  # R7a: a blast with the ball alive = stoppage if within slow_s the
  before_s: 1.0                #      lowest 1 s mean player speed <= slow_ratio x the speed of the
  slow_ratio: 0.7              #      before_s before it, or <= slow_ms (D-SLOW's walking speed)
  slow_ms: 1.1
  merge_s: 15                  #      dead up to the rules' next stoppage within merge_s,
  max_s: 30                    #      else up to the next kick from rest within max_s
  restart: false               # R7b: a blast inside a stoppage = play restarts within restart_s.
                               #   BAR-ATH, no labels: the 13717 frames it gave back to play look
                               #   dead (broadcast on a cut 71%, players 1.0 m/s, ball seen 23%);
                               #   with a kick required (restart_need_kick) 6 cases -> off
  restart_need_kick: false
  restart_s: 2.0
  restart_min_dead_s: 5.0      #      (not the whistle that stopped play: the stoppage >= this old)
decel_start:                   # (3) move D-SLOW starts back over the collective deceleration
  enabled: false               #     IDSSE: -0.001 degraded, 0.000 clean -> off
  back_max_s: 1.5
  min_decel: 0.0

formations:                    # (4) + (10) set pieces seen from the players
  slow_ms: 1.0                 # a player slower than this is "standing"
  wall_m: 1.5                  # wall: >= wall_n players of one team this close, all standing
  wall_n: 3
  corner_m: 2.5                # corner: a standing player this close to a corner flag
  out_m: 1.0                   # throw-in: a player beyond a touchline by this much
  goal_kick_strict: true       # goal kick: ball SEEN still in the goal area (else = keeper's hold)
  gk_ball_still_ms: 0.5
  use: [wall]                  # IDSSE: wall +0.003 / +0.002; corner, throw-in, goal kick ~0 or
                               # negative on clean tracking -> implemented, not used
formation_dead:
  min_s: 1.0
  bridge_s: 1.0
  back_s: 8                    # back over the deceleration / walking to the stoppage
  walk_ms: 1.5
  lead_s: 3                    # to the kick
  kick_speed: 8.0

broadcast_dead:                # D-BC (broadcast cuts): no broadcast on IDSSE, so it cannot be
  enabled: false               # validated there -> OFF by default (REPORT_B.md, section 4)
  min_s: 3.0                   # cut spans shorter than this are ignored
  bridge_s: 1.0                # live islands shorter than this inside a cut are bridged
  v_max_ms: 1.5                # tactical mean player speed under this = nobody playing
  kick_speed: 8.0              # a ball seen faster than this = play
  close_s: 1.0
  min_dead_s: 3.0
broadcast_count_dead:          # D-BCN (point 5): broadcast on a cut AND fewer than max_players
  enabled: false               # players in the tactical radar -> D. OFF: no broadcast on IDSSE
  max_players: 19              # 1 s mean of the tracked players (median during play: 21.7)
  smooth_s: 1.0
  close_s: 1.0
  min_dead_s: 2.0
broadcast_ball: false          # fill the tactical ball gaps with the aligned broadcast ball
