# Approach C (v3: possession as CHALLENGE.md words it + goalkeeper window; v2 = config_c)
# Approach C (v2): segment first, then assign the team (hmm_v0/segment_c.py).
# All values a priori, with their reason; to be compared / tuned ONLY on the IDSSE validation
# (other games), never on the BAR-ATH public window.

# -- 1. dead ball ---------------------------------------------------------------------------------
dead:
  # rules = D evidence of the D rules (D-OUT, D-GOAL, D-KO, D-SP, D-WHISTLE, D-HOLD, ...), no NN
  # hmm   = the D of the v1 engine (NN + HMM), the best D measured so far (D F1 0.82 on IDSSE)
  # v2 default: hmm (IDSSE round 1: C+hmm D 0.304 vs C+rules D 0.223 spellF1)
  source: hmm
  min_evidence: 1.0          # nats of D evidence (votes.py): a D vote with w >= ~0.5
  close_gap_s: 1.0           # a < 1 s alive gap between two D spells is the same stoppage
  min_dead_s: 2.0            # no restart takes less (same reason as the v1 Bakis minimum)
  min_alive_s: 1.0           # an alive island < 1 s between two stoppages is noise
  # v3: D anchored on the Smart Tagging set pieces, also when the ball is not seen (segment_c.st_dead)
  smart_tagging:
    enabled: true
    types: [throw-in, corner kick, goal kick, free kick]   # kick-offs: D-KO already covers them
    pre_s: 3.0               # dead before the tag start: the thrower is already off the pitch ~3 s
                             # before it (BAR-ATH tracking), the ball went out earlier still
    lead_max_s: 15.0         # the restart is searched in [tag start, +15 s]: BAR-ATH first fast ball
                             # after the tag +3..+10 s (corners), mostly < +10 s (throw-ins)
    default_lead_s: 5.0      # no sign of play seen: restart assumed 5 s after the tag (lower part
                             # of the range above: prudent, D is not stretched into live play)
    kick_speed: 8.0          # m/s: a ball seen this fast is in play (a restart kick or throw)
    back_to_last_action_s: 20  # D starts at the last action seen before the tag (end of a contact
                             # or ball seen fast), at most 20 s before (a throw-in takes ~14 s
                             # median on IDSSE); nothing seen -> tag start - pre_s.
                             # IDSSE (simulated tagging): +0.011 spellF1 degraded (7/7), -0.001 clean

# -- 2. candidate boundaries: the only frames where possession may change -------------------------
boundary_rules: [T-INTERCEPT, T-REV, R-TOUCH, R-KO, P-FREE]   # + every contact start (always)
reappear_after_s: 0.5        # first frame the ball is seen again after a gap >= T_X_MIN

# -- 3. team evidence per frame (> 0 home), summed over a segment in seconds ----------------------
weights:
  contact: 1.0               # a control episode (any length), x its strength: the direct signal
  rules:                     # signed votes of the rules, x their strength
    P-DRIB: 0.0              # 0: already counted as a contact (no double counting)
    P-FREE: 0.0              # v3: 0 -- the contacts already carry it (IDSSE: no loss, REPORT_C_v3)
    P-PASS: 0.0              # v3: 0 -- idem
    T-INTERCEPT: 1.0
    T-REV: 0.0               # v3: 0 -- idem
    R-TOUCH: 1.0
    R-KO: 2.0
    S-PHASE: 0.1             # slow signals: only to carry segments where the ball is unseen
    P-SHAPE: 0.0             # v3: 0 -- idem
  nearest: 0.3               # team of the nearest player when the ball is seen ...
near_max_m: 5.0              # ... only if someone is within 5 m of the ball
near_gap_m: 2.0              # ... weighted by how uncontested: full weight from a 2 m gap

# -- assignment ------------------------------------------------------------------------------------
# a change of team costs this many seconds of full-strength evidence. A priori 1 s (~T_CONTROL);
# chosen 0.5 on the IDSSE validation (other games): 2 > 1 > 0.5 > 0.25 in spellF1, 0.25 better than
# 0.5 by only +0.007 (5/7 matches) -> the more conservative value, because DFL possession is
# finer than the challenge's and would push lambda too low (REPORT_C_v2 §4)
change_penalty_s: 0.5

# -- v3: possession by CONFIRMED control (segment_c.py, section v3) --------------------------------
# mode control : a team gains possession only at the start of a confirmed contact (>= T_CONTROL,
#                or followed by a team-mate's contact within T_PASS_MAX) or at a restart; touches,
#                deflections, duels and unseen-ball stretches change nothing (CHALLENGE.md).
#                lambda, the candidates and the per-rule weights above are NOT used for the team;
#                `weights` only decide a stretch with no gain at all (ball never controlled in sight)
# mode evidence: the v2 segment + dynamic programme
possession:
  # v3 default: evidence. `control` (the literal state machine) was measured on IDSSE and lost
  # 0.05 spellF1 (degraded) / 0.04 (clean), 0/7 matches: kept as an option, see REPORT_C_v3
  mode: evidence
  restart_rules: [R-TOUCH, R-KO]      # whoever restarts has the ball
goalkeeper:
  enabled: true
  # a team's deepest player controlling the ball in his own box = control (hands); his hold is
  # contacts of the same player closer than this (opponents pressing him do not break it)
  merge_s: 2.0
  weight: 2.0                # evidence per frame of the window for his team (2x a contact)
  min_hold_s: 1.0            # a hold in his hands lasts >= T_CONTROL; a shorter touch is at his feet
