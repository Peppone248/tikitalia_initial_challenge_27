# Every constant of the module, with its reason.
fps: 25                  # frame rate of the project and of IDSSE
min_run_frames: 25       # 1 s: a team run shorter than this between two runs of the other team is a flip artefact
default_length: 105.0    # m, used when the source reports no pitch size (pitch_x == 0)
default_width: 68.0      # m, same reason
labels: {H: 0, A: 1, D: 2, X: 3}   # same codes as evaluation/possession_metrics.label_codes
degrade:                 # makes clean external tracking look like the provided match's automatic tracking
  dead_hide_p: 0.8       # probability that a whole dead-ball run loses the ball: in the provided match the ball is mostly missing when play is stopped
  live_gap_s: [1, 3, 8, 20]   # a-priori quantiles (s) of the ball-gap length in live play; gaps are drawn by piecewise-linear inverse CDF between them
  live_seen_target: 0.6  # share of live frames with the ball seen: the provided match misses the ball ~41% of all frames, mostly in dead ball
  player_drop_frac: 0.07 # share of each player's frames lost to broken tracks (short stretches of 1-10 s)
  player_drop_s: [1, 10] # s, min and max length of a lost-track stretch: automatic tracking loses a player for a few seconds at a time
  max_iter: 100000       # safety cap on gap/stretch draws; hitting it means a target is unreachable and raises
