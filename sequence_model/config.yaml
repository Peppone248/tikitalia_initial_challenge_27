# Every constant of the module, with its reason.
fps: 25                  # frame rate of the project and of IDSSE
min_run_frames: 25       # 1 s: a team run shorter than this between two runs of the other team is a flip artefact
default_length: 105.0    # m, used when the source reports no pitch size (pitch_x == 0)
default_width: 68.0      # m, same reason
labels: {H: 0, A: 1, D: 2, X: 3}   # same codes as evaluation/possession_metrics.label_codes
degrade:                 # makes clean external tracking look like the provided match's automatic tracking
  dead_hide_p: 0.8       # probability that a whole dead-ball run loses the ball: in the provided match the ball is mostly missing when play is stopped
  live_gap_s: [1, 3, 8, 20]   # a-priori quantiles (s) of the ball-gap length in live play; gaps are drawn by piecewise-linear inverse CDF between them
  live_seen_target: 0.6  # share of live frames with the ball seen: the provided match misses the ball ~41% of all frames, mostly in dead ball
  player_drop_frac: 0.07 # share of each player's frames lost to broken tracks (short stretches of 1-10 s)
  player_drop_s: [1, 10] # s, min and max length of a lost-track stretch: automatic tracking loses a player for a few seconds at a time
  max_iter: 100000       # safety cap on gap/stretch draws; hitting it means a target is unreachable and raises
features:
  smooth_frames: 5       # centred moving average on positions before differencing: tracking jitter would otherwise dominate speeds
  unseen_cap_s: 60       # s, the ball-absence counter saturates: beyond a minute the exact length carries no more information
  slow_speed: 1.1        # m/s, mean speed of all players below which everybody is walking (dead-ball signature in the team reports)
  out_margin: 0.5        # m, a-priori tolerance outside the touch/goal lines before the ball counts as out
  near_radii: [3, 8]     # m, pressure radii around the ball (a-priori: playing distance and zone of influence)
  neutral_nearest: 50    # m, nearest-player distance when a team has no tracked player (far away, no pressure)
  shape_quantiles: [0.1, 0.9]   # robust extent of a team (width, length) ignoring outliers such as the keeper
  max_player_speed: 12   # m/s, human sprint limit (same as V_PLAYER_MAX of the team's model); faster is a tracking glitch and counts as unknown
  max_ball_speed: 40     # m/s, physical limit of a kicked ball (same as the ball detector's); faster is a glitch and gives the neutral speed 0
decode:                  # 3-state HMM decoder (decode.py)
  min_frames: {H: 20, A: 20, D: 50}   # 0.8 s / 0.8 s / 2 s: shortest plausible possession and stoppage; enforced by chains of that many sub-states
  change_every_s: 20     # a priori: a possession change H<->A every 20 s of possession (default transition rate)
  stop_every_s: 30       # a priori: a stoppage every 30 s of play (H->D, A->D default rate)
  stop_extra_s: 12       # a priori: a stoppage lasts on average 12 s beyond its minimum (D->H, D->A share this, half each)
  eps: 1.0e-6            # added to probabilities before the log: exact 0 must not give -inf
  max_exit: 0.5          # cap on the total per-frame exit probability of a state: keeps self-loops in (0,1) even with degenerate rates (e.g. count_transitions with no exposure gives 1); each of the two exits is capped at half
  rate_floor: 1.0e-12    # lower bound of every transition rate: log(0) must not occur
frame_model:             # per-frame logistic regression (frame_model.py)
  l2: 1.0                # ridge penalty on the weights (not the intercepts), on the summed log-loss: mild shrinkage, a-priori value
  step: 3                # every 3rd frame of each training match: neighbouring frames are near-duplicates, 3x faster fit
  max_iter: 50           # Newton iterations cap: the problem is convex and converges in far fewer
  tol: 1.0e-8            # Newton stops when the largest parameter step is below this
baseline50:              # reference predictor (evaluate.py)
  half_window: 50        # frames each side of the majority vote (+-2 s at 25 fps): the reference smoothing
tcn:                     # bidirectional temporal convolutional network (tcn.py)
  channels: 32           # width of every layer: small, the training set is only a few matches
  levels: 6              # dilations 1..32 with kernel 5: receptive field +-126 frames (+-5 s) around each frame
  kernel: 5              # odd, so "same" padding is symmetric (non-causal: looks backward and forward)
  window: 1500           # frames (60 s) per training window, always inside a single period
  batch: 8               # windows per gradient step
  lr: 1.0e-3             # Adam learning rate
  windows_per_epoch: 200 # one "epoch" = 200 random windows (25 steps): a fixed budget, independent of match length
  max_epochs: 15         # hard cap on training length
  patience: 3            # epochs without improvement of the held-out loss before stopping
  change_k: 12           # frames: the change head fires within +-12 frames (0.5 s) of a direct H<->A change
  change_weight: 0.5     # weight of the change-head BCE relative to the H/A/D cross-entropy
  swap_p: 0.5            # probability of the team-swap augmentation on each batch
  threads: 4             # torch CPU threads
